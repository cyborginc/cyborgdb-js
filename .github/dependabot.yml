version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # TypeScript 7 is blocked on ts-jest, whose peer range is `>=4.3 <7`.
    # Upstream support needs TypeScript 7.1 (kulshekhar/ts-jest#5366), so major
    # bumps are ignored until then to stop a permanently-failing weekly PR.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: "development"
      prod-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
