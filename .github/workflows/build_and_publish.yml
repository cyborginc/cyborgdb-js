name: Build and Package CyborgDB
on:
  push:
    branches: ["main"]
    tags:
        - "v*"
            
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout SDK code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install SDK dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

  compute_version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      env: ${{ steps.compute.outputs.env }}
    steps:
      - name: Compute environment
        id: compute
        run: |
          # For tags, determine based on tag pattern
          if [[ "${{ github.ref }}" == "refs/tags/"* ]]; then
            TAG="${{ github.ref_name }}"
            if [[ "$TAG" == *"rc"* ]]; then
              echo "env=staging" >> $GITHUB_OUTPUT
            else
              echo "env=prod" >> $GITHUB_OUTPUT
            fi
          else
            # Default to dev for PRs and main branch
            echo "env=dev" >> $GITHUB_OUTPUT
          fi

  test:
    runs-on: ubuntu-latest
    needs: [lint, compute_version]
    permissions:
      contents: read
      id-token: write

    services:
      postgres:
        image: postgres:15-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cyborgdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout SDK code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Python for server
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TOKEN }}
          CYBORGDB_API_KEY: "op://CyborgDB/CyborgDB ${{ needs.compute_version.outputs.env == 'dev' && 'Dev' || needs.compute_version.outputs.env == 'staging' && 'Staging' || 'Prod' }}/CYBORGDB_API_KEY_STANDARD"

      - name: Load CodeArtifact account ID from 1Password
        if: needs.compute_version.outputs.env != 'prod'
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TOKEN }}
          CA_AWS_ACCOUNT_ID: "op://CyborgDB/CyborgDB ${{ needs.compute_version.outputs.env == 'dev' && 'Dev' || 'Staging' }}/CA_AWS_ACCOUNT_ID"

      - name: Get CodeArtifact pip index URL
        if: needs.compute_version.outputs.env != 'prod'
        id: ca-url
        uses: ./.github/workflows/actions/codeartifact-pip-url
        with:
          aws-account-id: ${{ env.CA_AWS_ACCOUNT_ID }}
          role-to-assume: arn:aws:iam::${{ env.CA_AWS_ACCOUNT_ID }}:role/CyborgGitHubActionsS3Role
          codeartifact-repository: ${{ needs.compute_version.outputs.env == 'dev' && 'cyborg-dev' || 'cyborg-staging' }}

      - name: Export PIP_INDEX_URL
        if: needs.compute_version.outputs.env != 'prod'
        run: echo "PIP_INDEX_URL=${{ steps.ca-url.outputs.pip-index-url }}" >> $GITHUB_ENV

      - name: Install cyborgdb-service
        run: |
          # Install CPU-only torch
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Install optional test dependencies
          pip install sentence-transformers
          # For dev/staging, PIP_INDEX_URL points at CodeArtifact (PyPI upstream). For prod, it is unset and pip falls back to PyPI.
          pip install "cyborgdb-service[embeddings]" --pre

      - name: Install SDK dependencies
        run: |
          npm ci

      - name: Build SDK
        run: npm run build

      - name: Test with Standard version
        run: |
          echo "=== Testing with Standard version ==="
          # Set up environment for Standard
          export CYBORGDB_DB_TYPE=postgres
          export CYBORGDB_CONNECTION_STRING="host=localhost port=5432 dbname=cyborgdb user=postgres password=postgres"
          export CYBORGDB_SERVICE_LOG_LEVEL=DEBUG

          # Start the service with Standard API key
          nohup cyborgdb-service > server-standard.log 2>&1 &
          echo $! > server-standard.pid

          # Wait for service to be ready
          for i in {1..30}; do
            if curl -fs http://localhost:8000/v1/health > /dev/null; then
              echo "Standard service is up!"
              break
            fi
            sleep 1
          done

          if ! curl -fs http://localhost:8000/v1/health > /dev/null; then
            echo "Standard service failed to start"
            cat server-standard.log
            exit 1
          fi

          # Run all tests
          npm run test:coverage

          # Stop standard server
          kill $(cat server-standard.pid) || true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v6
        with:
          directory: ./coverage
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  test_package:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Pack for testing
        run: npm pack

      - name: Test packed package installation
        run: |
          # Create a test directory and install the packed package
          mkdir test-install
          cd test-install
          npm init -y
          npm install ../cyborgdb-*.tgz
          # Verify package can be imported
          node -e "
            try {
              const cyborgdb = require('cyborgdb');
              console.log('Package imported successfully');
              console.log('Package exports:', Object.keys(cyborgdb));
            } catch (error) {
              console.error('Failed to import package:', error.message);
              process.exit(1);
            }
          "

  build_package:
    permissions:
      contents: read
    needs: test_package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build package
        run: npm run build
      
      - name: Create package tarball
        run: |
          npm pack
          echo "Built package:"
          ls -la *.tgz
      
      - name: Store package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyborgdb-package
          path: "*.tgz"
          retention-days: 5

  publish_to_npm:
    needs: [build_package]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    environment: prod
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Verify version matches tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF#refs/tags/}"
          # Remove 'v' prefix if present
          TAG_VERSION="${TAG#v}"

          echo "Package version: $PACKAGE_VERSION"
          echo "Tag: $TAG"
          echo "Tag version: $TAG_VERSION"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch!"
            echo "   package.json: $PACKAGE_VERSION"
            echo "   Git tag: $TAG_VERSION"
            echo ""
            echo "Please update package.json version to match the tag before pushing:"
            echo "   npm version $TAG_VERSION --no-git-tag-version"
            echo "   git add package.json"
            echo "   git commit -m \"Bump version to $TAG_VERSION\""
            exit 1
          fi
          echo "✅ Versions match: $PACKAGE_VERSION"
      
      - name: Build package
        run: npm run build
      
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: cyborgdb-package
      
      - name: Display package info
        run: |
          echo "Package contents:"
          ls -la *.tgz
          npm pack --dry-run
      
      - name: Load NPM token from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TOKEN }}
          NPM_TOKEN: "op://CyborgDB/CyborgDB Prod/NPM_ACCESS_TOKEN"

      - name: Publish to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}