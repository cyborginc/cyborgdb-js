name: Test CyborgDB JavaScript SDK
permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SDK code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install SDK dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

  compute_version:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.compute.outputs.env }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute environment
        id: compute
        run: |
          # For PRs and main branch pushes, use dev environment
          # For tags, determine based on tag pattern
          if [[ "${{ github.ref }}" == "refs/tags/"* ]]; then
            TAG="${{ github.ref_name }}"
            if [[ "$TAG" == *"rc"* ]]; then
              echo "env=staging" >> $GITHUB_OUTPUT
            else
              echo "env=prod" >> $GITHUB_OUTPUT
            fi
          else
            # Default to dev for PRs and main branch
            echo "env=dev" >> $GITHUB_OUTPUT
          fi

  test:
    needs: [lint, compute_version]
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cyborgdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout SDK code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Set up Python for server
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TOKEN }}
          CYBORGDB_API_KEY: "op://CyborgDB/CyborgDB ${{ needs.compute_version.outputs.env == 'dev' && 'Dev' || needs.compute_version.outputs.env == 'staging' && 'Staging' || 'Prod' }}/CYBORGDB_API_KEY_STANDARD"

      - name: Load Extra Index URL from 1Password
        if: needs.compute_version.outputs.env != 'prod'
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TOKEN }}
          PIP_EXTRA_INDEX_URL: "op://CyborgDB/CyborgDB ${{ needs.compute_version.outputs.env == 'dev' && 'Dev' || 'Staging' }}/PIP_EXTRA_INDEX_URL"

      - name: Install service dependencies
        run: |
          # Install CPU-only torch
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Install optional test dependencies
          pip install sentence-transformers

      - name: Install cyborgdb-service
        run: |
          # Install cyborgdb-service (from Cloudsmith for dev/staging, PyPI for prod)
          pip install "cyborgdb-service[embeddings]" --pre ${PIP_EXTRA_INDEX_URL:+--extra-index-url "$PIP_EXTRA_INDEX_URL"}
          
      - name: Install SDK dependencies
        run: |
          npm ci

      - name: Build SDK
        run: npm run build
          
      - name: Test with Standard version
        run: |
          echo "=== Testing with Standard version ==="
          # Set up environment for Standard
          export CYBORGDB_DB_TYPE=postgres
          export CYBORGDB_CONNECTION_STRING="host=localhost port=5432 dbname=cyborgdb user=postgres password=postgres"
          export CYBORGDB_SERVICE_LOG_LEVEL=DEBUG
          
          # Start the service with Standard API key
          nohup cyborgdb-service > server-standard.log 2>&1 &
          echo $! > server-standard.pid
          
          # Wait for service to be ready
          for i in {1..30}; do
            if curl -fs http://localhost:8000/v1/health > /dev/null; then
              echo "Standard service is up!"
              break
            fi
            sleep 1
          done
          
          if ! curl -fs http://localhost:8000/v1/health > /dev/null; then
            echo "Standard service failed to start"
            cat server-standard.log
            exit 1
          fi
          
          # Run all tests
          npm run test:coverage
          
          # Stop standard server
          kill $(cat server-standard.pid) || true
          
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          directory: ./coverage
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true